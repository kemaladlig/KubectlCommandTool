apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-command-tool-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubectl-command-tool-server
  template:
    metadata:
      labels:
        app: kubectl-command-tool-server
    spec:
      containers:
        - name: kubectl-command-tool-server
          image: kemaladlig/k-command-tool-server:v1.2
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI