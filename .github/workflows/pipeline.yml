name: Build and Deploy to GKE

on:
  push:
    branches:
      - release  # Or "main"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: kubectl-command-cluster
  GKE_ZONE: europe-west1-b
  CLIENT_IMAGE: k-command-tool-client
  SERVER_IMAGE: k-command-tool-server

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Calculate version from commit count and prepend "v"
      - name: Set version from commit count
        id: set_version
        run: echo "VERSION=v$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # -------- Build & Push SERVER ----------
      - name: Build and push server image
        run: |
          docker build -t kemaladlig/k-command-tool-server:$VERSION ./server
          docker push kemaladlig/k-command-tool-server:$VERSION

      # -------- Build & Push CLIENT ----------
      - name: Build and push client image
        run: |
          docker build -t kemaladlig/k-command-tool-client:$VERSION ./client
          docker push kemaladlig/k-command-tool-client:$VERSION

      # -------- Set Kube credentials ----------
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      # -------- Deploy to GKE ---------
      - name: Deploy Client
        run: |
          # Replace VERSION with actual version in the YAML file
          sed "s|\${VERSION}|$VERSION|g" ./client/frontend-deployment.yaml | kubectl apply -f -

      - name: Deploy Server
        run: |
          # Replace VERSION with actual version in the YAML file
          sed "s|\${VERSION}|$VERSION|g" ./server/backend-deployment.yaml | kubectl apply -f -

