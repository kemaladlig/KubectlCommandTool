apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-command-tool-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubectl-command-tool-client
  template:
    metadata:
      labels:
        app: kubectl-command-tool-client
    spec:
      containers:
        - name: kubectl-command-tool-client
          image: europe-west1-docker.pkg.dev/kubectl-command-tool/kubectl-artifact/k-command-tool-client:${{ github.sha }}

          ports:
            - containerPort: 3000
          env:
            - name: SERVER_URL
              value: "http://kubectl-command-tool-server:3000"
